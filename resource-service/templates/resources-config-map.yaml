apiVersion: v1
kind: ConfigMap
metadata:
  name: resources-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "resources-ms.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  DB_URL: "jdbc:postgresql://{{ .Values.database.service.name }}:{{ .Values.database.service.port }}/{{ .Values.config.postgresDb }}"
  RESOURCES_DB_URL: {{ .Values.database.service.name | quote }}
  RESOURCES_DB_PORT: {{ .Values.database.service.port | quote }}
  PGDATA: {{ .Values.config.pgdata | quote }}
  SONGS_MS_URL: {{ .Values.config.songsMsUrl | quote }}
  SONGS_MS_PORT: {{ .Values.config.songsMsPort | quote }}
  SERVER_PORT: {{ .Values.service.targetPort | quote }}
  RESOURCES_MS_PORT: {{ .Values.service.port | quote }}
