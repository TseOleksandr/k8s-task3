{{- if .Values.appStorage.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.appStorage.pvName }}-{{ .Values.namespace }}
spec:
  capacity:
    storage: {{ .Values.appStorage.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.appStorage.storageClassName }}
  persistentVolumeReclaimPolicy: {{ .Values.appStorage.reclaimPolicy }}
  hostPath:
    path: {{ .Values.appStorage.hostPath }}
    type: DirectoryOrCreate
{{- end }}
