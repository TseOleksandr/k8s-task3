namespace: k8s-program

nameOverride: ""
fullnameOverride: resources-ms

replicaCount: 2

image:
  repository: resources-image
  tag: "2.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

database:
  image: postgres:16
  service:
    name: resources-db
    port: 5432
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    storageClassName: standard
    size: 1Gi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

appStorage:
  enabled: true
  pvName: resources-pv
  pvcName: resources-pvc
  storageClassName: manual
  size: 1Gi
  hostPath: /mnt/data/resources
  reclaimPolicy: Retain

config:
  postgresDb: postgres
  pgdata: /var/lib/postgresql/data/pgdata
  songsMsUrl: songs-ms
  songsMsPort: "8081"

secret:
  existingSecret: ""
  springDatasourceUsername: postgres
  springDatasourcePassword: postgres
  postgresUser: postgres
  postgresPassword: postgres

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 768Mi

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
