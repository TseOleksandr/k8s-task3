apiVersion: v1
kind: ConfigMap
metadata:
  name: songs-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "songs-ms.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  DB_URL: {{ .Values.config.dbUrl | quote }}
  SONGS_DB_URL: {{ .Values.database.service.name | quote }}
  SONGS_DB_PORT: {{ .Values.database.service.port | quote }}
  PGDATA: {{ .Values.config.pgdata | quote }}
  SONGS_MS_PORT: {{ .Values.config.songsMsPort | quote }}
  RESOURCES_MS_PORT: {{ .Values.config.resourcesMsPort | quote }}
