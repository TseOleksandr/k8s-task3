apiVersion: v1
kind: Service
metadata:
  name: songs-ms
  namespace: {{ .Values.namespace }}
  labels:
    app: songs-ms
spec:
  type: {{ .Values.service.type }}
  selector:
    app: songs-ms
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
